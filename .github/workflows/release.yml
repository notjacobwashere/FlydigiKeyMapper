name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build tested installer
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            artifacts/FlydigiKeyMapper-Setup-*-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/usbpcap-src-incl-pdb-1.5.4.0.7z
            artifacts/USBPcap-LICENSES.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=([xml](Get-Content ./src/FlydigiKeyMapper.csproj)).Project.PropertyGroup.Version
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag and app version must match' }
          gh release create '${{ github.ref_name }}' artifacts/FlydigiKeyMapper-Setup-*-x64.exe artifacts/SHA256SUMS.txt artifacts/usbpcap-src-incl-pdb-1.5.4.0.7z artifacts/USBPcap-LICENSES.txt --title "Flydigi Key Mapper $version" --generate-notes
